name: VOAT Scraper Scheduler

on:
  schedule:
    # 1時間ごとに実行 (混雑を避けるため中途半端な「毎時27分」に実行)
    - cron: '27 * * * *'
  workflow_dispatch: # 手動実行ボタンも追加

# 同時に複数の実行が走るのを防ぐ設定（予定の重複登録を防止）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create service-account.json
        run: echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > service-account.json

      - name: Run Scraper
        run: |
          if [ -n "${{ secrets.VOAT_ACCOUNTS_JSON }}" ]; then
            echo "Running multi-teacher master sync..."
            node sync_all_teachers.js
          else
            echo "Running single-teacher sync..."
            npm start
          fi
        env:
          VOAT_LOGIN_ID: ${{ secrets.VOAT_LOGIN_ID }}
          VOAT_PASSWORD: ${{ secrets.VOAT_PASSWORD }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          VOAT_ACCOUNTS_JSON: ${{ secrets.VOAT_ACCOUNTS_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || '1vwLDxLeLrUb6icuYU9M0w4feTPpNf_mPxRItHSS30s4' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN || 'Nmla7Cogq/6jILUzytIw8KmrB54KaXUzOvmroMZcg0ns4K/jToWVJjmVNe+Nu2weHCrgsXvbvQiboHCP7FLGEgAyjLnvWTDRCjAAtaQoH5ynVxuJ6vnfskVKsuPf2laSW71yIEuuY9hHzNAJLZEKvQdB04t89/1O/w1cDnyilFU=' }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID || 'U1c94008254a2d065c85b9eed253ccf12' }}

